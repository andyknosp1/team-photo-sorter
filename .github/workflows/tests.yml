name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the tests use synthetic face data, so the face model isn't needed
      - run: pip install numpy scipy pillow cryptography pytest "tomli; python_version < '3.11'"
      - run: pytest -q
